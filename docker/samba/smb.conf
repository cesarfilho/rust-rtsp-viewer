[global]
   server role = standalone server
   server string = rust-rtsp-viewer
   workgroup = WORKGROUP
   # Só SMB2/3 (o SMB1 é inseguro e o Windows já não o liga); só a porta 445, sem NetBIOS.
   server min protocol = SMB2_10
   smb ports = 445
   disable netbios = yes
   # Ninguém entra como convidado: só o usuário criado pelo entrypoint. A sessão anônima só serve para
   # listar os nomes dos compartilhamentos (o Nautilus/gvfs tenta assim antes de pedir a senha; com
   # `restrict anonymous = 2` ele mostrava um erro em vez do pedido de senha). Os arquivos pedem login.
   map to guest = never
   restrict anonymous = 0
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # auth_audit:3 registra cada tentativa de login (usuário e resultado, nunca a senha).
   log level = 1 auth_audit:3

[gravacoes]
   comment = Gravações e snapshots do rust-rtsp-viewer
   path = /share
   read only = yes
   browseable = yes
   valid users = @SMB_USER@
   # Lê os arquivos como o dono deles (o UID do daemon).
   force user = @SMB_USER@
   # Arquivos de macOS / Windows que nunca devem aparecer aqui.
   veto files = /._*/.DS_Store/Thumbs.db/*.tmp/
