[package]
name = "rrv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false # aplicativo, não vai para o crates.io
description = "Motor de vídeo do rust-rtsp-viewer: captura, reconexão, gravação, movimento. Sem interface."

[features]
# Câmera HLS ao vivo simulada e utilitários dos testes (usada também pelo daemon).
testing = []
# Detecção de objetos (YOLO via ONNX Runtime, carregado em tempo de execução: ORT_DYLIB_PATH).
detect = ["dep:ort"]

# Sem `iced` aqui, nunca: este crate é o que o daemon sem janela executa (ADR 0010).
[dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
bytes = "1"
log = "0.4"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1.14"
thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2.190"
# ONVIF: SOAP é lido com roxmltree; a senha vai como WS-UsernameToken (digest SHA-1).
roxmltree = "0.20"
sha1 = "0.10"
# Autenticação do canal TCP: HMAC-SHA256 de um desafio (o token nunca trafega).
hmac = "0.12"
sha2 = "0.10"
# MQTT sem TLS (use-rustls desligado): `mqtt://` apenas; broker local ou VPN.
rumqttc = { version = "0.25", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "cuda"], optional = true }

[dev-dependencies]
toml = "0.8"
# o crate se auto-referencia para ligar a feature `testing` nos próprios testes
rrv-core = { path = ".", features = ["testing"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
