[package]
name = "rrv-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false # aplicativo, não vai para o crates.io
description = "Motor do rust-rtsp-viewer sem janela: captura, grava e detecta com a janela fechada (ADR 0010)."

[[bin]]
name = "rrv-daemon"
path = "src/main.rs"

[dependencies]
rrv-core = { path = "../rrv-core" }
gstreamer = "0.25"
log = "0.4"
env_logger = "0.10"
clap = { version = "4", features = ["derive", "env"] }
# SIGTERM/SIGHUP além de SIGINT: `docker stop` envia SIGTERM.
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
rrv-core = { path = "../rrv-core", features = ["testing"] }
gstreamer = "0.25"
