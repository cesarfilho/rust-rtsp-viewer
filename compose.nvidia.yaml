# Decodificação por GPU NVIDIA (NVDEC) no contêiner (decisão D6, plano 2.5.10).
#
#   scripts/check-nvidia-host.sh                       # confere o host e diz o que falta instalar
#   docker compose -f compose.yaml -f compose.nvidia.yaml up -d
#   docker exec rrv rrvctl status                      # a coluna "decodificador" mostra nvh264dec (GPU)
#
# Usa CDI (Container Device Interface), que o Docker 25+ lê direto de /etc/cdi: **não precisa reiniciar o
# Docker** (nem derrubar os outros contêineres). No host, só:
#   sudo pacman -S nvidia-container-toolkit
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
# (Refaça o `cdi generate` depois de atualizar o driver NVIDIA.)
#
# A imagem já traz o plugin `nvcodec` do GStreamer: o CDI injeta as bibliotecas do driver (libcuda, libnvcuvid) e
# só então o plugin registra `nvh264dec` / `nvh265dec`.
#
# Pode ser combinado com o VA-API (`-f compose.vaapi.yaml`), mas os dois disputam o mesmo `decodebin`: o
# `GST_PLUGIN_FEATURE_RANK` abaixo põe o NVDEC na frente.
services:
  rrv:
    # `driver: cdi` pede o dispositivo CDI pelo nome (Docker 28.3+ / Compose recente); o `devices:` simples
    # seria lido como um caminho em /dev.
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: [gpu]   # o esquema do Compose exige; com CDI não muda o que é injetado
              device_ids:
                - nvidia.com/gpu=all
    environment:
      # Acima do avdec_h264 (256) o NVDEC é sempre escolhido.
      GST_PLUGIN_FEATURE_RANK: "nvh264dec:260,nvh265dec:260"
