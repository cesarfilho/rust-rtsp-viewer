name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Inclui os testes de integração (`tests/`): gravação e reconexão rodam
      # pipelines GStreamer reais (~10 s). O de estresse é `#[ignore]`.
      - name: Testes
        run: cargo test --workspace

      - name: Testes de documentação
        run: cargo test --workspace --doc

  # Licenças, vulnerabilidades conhecidas (RustSec) e fontes — ver deny.toml.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Garante que o `rust-version` do Cargo.toml (let-chains) continua compilando.
  msrv:
    runs-on: ubuntu-24.04
    env:
      # Sobrepõe o rust-toolchain.toml (que pede "stable").
      RUSTUP_TOOLCHAIN: "1.92"
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.92

      - uses: Swatinem/rust-cache@v2

      - name: Compila no MSRV
        run: cargo check --workspace --all-targets

  # A imagem do daemon sem janela (ADR 0010) tem de continuar compilando. Não
  # publica nada: só constrói, com cache de camadas do GitHub Actions.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Constrói a imagem rrv-daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rust-rtsp-viewer/rrv-daemon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sem câmeras o daemon se recusa a subir: prova que o binário roda na
      # imagem (bibliotecas e plugins do GStreamer presentes) e valida o config.
      - name: Valida o config de exemplo dentro da imagem
        run: |
          docker run --rm \
            -v "$PWD/config.docker.toml.example:/config/config.toml:ro" \
            rust-rtsp-viewer/rrv-daemon:ci --check

