# O NVR sem janela: grava e detecta mesmo com a janela fechada (ADR 0010).
#
#   cp config.docker.toml.example config.docker.toml   # e edite as câmeras
#   make init-docker                                   # cria as pastas (recordings, state, secrets) e o config.docker.toml
#   # a senha de cada câmera: um arquivo em ./secrets com o nome usado no config (${nome}), ex.:
#   printf '%s' 'a-senha-da-camera' > secrets/cam_portao_password && chmod 600 secrets/cam_portao_password
#   docker compose up -d --build
#   docker compose logs -f rrv
#
# `docker compose stop` envia SIGTERM e espera o daemon finalizar as gravações.
services:
  rrv:
    build: .
    image: rust-rtsp-viewer/rrv-daemon:local
    container_name: rrv
    restart: always

    # RTP/UDP de volta das câmeras não atravessa bem a NAT do bridge; o modo host
    # é o mais simples. Alternativa: `protocols=tcp` nas câmeras e rede bridge.
    network_mode: host

    # Mesmo UID/GID do dono dos volumes (`id -u` / `id -g`), para os arquivos de
    # gravação ficarem seus. Exporte RRV_UID/RRV_GID se forem diferentes de 1000.
    user: "${RRV_UID:-1000}:${RRV_GID:-1000}"

    # Tempo para finalizar os segmentos de gravação antes do SIGKILL.
    stop_grace_period: 30s

    environment:
      TZ: "${TZ:-America/Sao_Paulo}"

    volumes:
      - ./config.docker.toml:/config/config.toml:ro
      - ${RRV_RECORDINGS:-./recordings}:/data
      - ./state:/state
      # As senhas das câmeras: cada arquivo de ./secrets vira /run/secrets/<nome>, que o `${nome}` do
      # config lê. A pasta inteira (e não um segredo por câmera) para o compose não falhar por um
      # arquivo que ainda não existe, e para qualquer câmera nova só precisar de um arquivo.
      - ./secrets:/run/secrets:ro
      # O socket de controle, numa pasta do disco (a janela e o rrvctl a acham sozinhos). Não em
      # $XDG_RUNTIME_DIR: o contêiner sobe no boot, antes do login, quando /run/user/<uid> não existe,
      # e o Docker criava a pasta como root (o daemon reiniciava sem parar). `make init-docker` a cria.
      - ${RRV_RUN_DIR:-${HOME}/.local/state/rust-rtsp-viewer/run}:/run/rrv

    # Decodificação por GPU Intel (VA-API) é a tarefa 2.5.10:
    # devices: ["/dev/dri:/dev/dri"]

  # As gravações (e os snapshots das detecções) como pasta de rede SMB, só leitura:
  #   Windows  \\192.168.1.146\gravacoes      macOS / Linux  smb://192.168.1.146/gravacoes
  # A senha do usuário (`SMB_USER`, padrão `rrv`) fica no segredo `smb_password`:
  #   printf '%s' 'uma-senha-forte' > secrets/smb_password && chmod 600 secrets/smb_password
  # O tráfego SMB3 sai assinado, mas use só na LAN: não abra a porta 445 para a internet.
  samba:
    build: docker/samba
    image: rust-rtsp-viewer/samba:local
    container_name: rrv-samba
    restart: always
    ports:
      - "445:445"
    environment:
      TZ: "${TZ:-America/Sao_Paulo}"
      SMB_USER: "${SMB_USER:-rrv}"
      SMB_UID: "${RRV_UID:-1000}"
      SMB_GID: "${RRV_GID:-1000}"
    volumes:
      - ${RRV_RECORDINGS:-./recordings}:/share:ro
    # Só este segredo (não a pasta ./secrets inteira, que tem as senhas das câmeras).
    secrets:
      - smb_password

secrets:
  smb_password:
    file: ./secrets/smb_password
