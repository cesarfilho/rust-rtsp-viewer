[package]
name = "rust-rtsp-viewer"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "Visualizador RTSP/HLS de baixa latência com grade multi-câmera, gravação, zonas de movimento e GUI Iced + GStreamer"
license = "AGPL-3.0-or-later"
repository = "https://github.com/cesarfilho/rust-rtsp-viewer"
readme = "README.md"
keywords = ["rtsp", "hls", "gstreamer", "iced", "cctv"]
categories = ["multimedia::video", "gui"]
default-run = "rust-rtsp-viewer"

[features]
default = []

[dependencies]
gstreamer = "0.20"
gstreamer-app = "0.20"
log = "0.4"
env_logger = "0.10"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
iced = { version = "0.13", features = ["image", "tokio", "advanced", "canvas"] }
chrono = { version = "0.4", features = ["clock"] }
serde_ignored = "0.1.14"

[[bin]]
name = "rust-rtsp-viewer"
path = "src/bin/iced_viewer.rs"
